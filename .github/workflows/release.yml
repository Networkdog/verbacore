name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src/VerbaCore/VerbaCore.csproj

      - name: Publish (self-contained)
        run: >
          dotnet publish src/VerbaCore/VerbaCore.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o publish-standalone

      - name: Update installer version
        shell: pwsh
        run: |
          $iss = Get-Content installer.iss -Raw
          $iss = $iss -replace '#define MyAppVersion ".*?"', "#define MyAppVersion `"${{ steps.version.outputs.VERSION }}`""
          Set-Content installer.iss $iss

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer.iss

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish-standalone/* -DestinationPath "VerbaCore-${{ steps.version.outputs.VERSION }}-portable.zip"

      - name: Generate latest.json (auto-update manifest)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          $installer = "installer-output/VerbaCore-Setup-$version.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            exit 1
          }
          $sha = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/VerbaCore-Setup-$version.exe"
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version      = $version
            url          = $url
            sha256       = $sha
            releaseDate  = $date
            releaseNotes = ""
            mandatory    = $false
          }
          ($manifest | ConvertTo-Json -Depth 4) | Set-Content -Path latest.json -Encoding UTF8
          Get-Content latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: VerbaCore ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer-output/VerbaCore-Setup-${{ steps.version.outputs.VERSION }}.exe
            VerbaCore-${{ steps.version.outputs.VERSION }}-portable.zip
            latest.json
